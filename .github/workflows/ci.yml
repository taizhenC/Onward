name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_DIST_DIR: .next-ci
      PERSISTENCE: memory
      LLM_PROVIDER: stub
      EMBEDDING_PROVIDER: stub
      RETRIEVAL_MODE: keyword

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check-figure
      - run: npm run check-story-spec
      - run: npm run check-story-artifact
      - run: npm run check-source-transparency
      - run: npm run check-resonance-feedback
      - run: npm run check-story-boundaries
      - run: npm run check-resonance-brief
      - run: npm run check-story-composer
      - run: npm run check-match-recovery
      - run: npm run eval-crisis
      - run: npm run smoke
      - run: npm run build
