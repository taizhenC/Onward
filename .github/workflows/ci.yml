name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_DIST_DIR: .next-ci
      PERSISTENCE: memory
      ONWARD_ALLOW_MEMORY_IN_PRODUCTION: "true"
      LLM_PROVIDER: stub
      EMBEDDING_PROVIDER: stub
      RETRIEVAL_MODE: keyword

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Protect immutable recipe evidence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          npm run check-recipe-immutability -- "${{ github.event.pull_request.base.sha }}"
          npm run check-prompt-releases -- "${{ github.event.pull_request.base.sha }}"
          npm run check-story-quality-immutability -- "${{ github.event.pull_request.base.sha }}"
      - name: Audit story-quality immutability after a main push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
          npm run check-story-quality-immutability -- "${{ github.event.before }}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check-facet-signal
      - run: npm run check-recipe-governance
      - run: npm run check-prompt-releases
      - run: node scripts/trusted/recipe-promotion-attestor.mjs self-test
      - run: npm run check-recipe-registry
      - run: npm run check-recipe-deployment
      - run: npm run check-recipe-failure-boundary
      - run: npm run check-figure
      - run: npm run check-story-spec
      - run: npm run check-story-artifact
      - run: npm run check-derived-output-retention
      - run: npm run check-story-quality-benchmark
      - run: npm run check-story-quality-immutability-self-test
      - run: npm run check-source-transparency
      - run: npm run check-resonance-feedback
      - run: npm run check-try-another
      - run: npm run check-telemetry
      - run: npm run check-telemetry-lifecycle
      - run: npm run check-telemetry-producers
      - run: npm run check-story-progress-telemetry
      - run: npm run check-feedback-telemetry
      - run: npm run check-alternate-request-telemetry
      - run: npm run check-alternate-resolution-telemetry
      - run: npm run check-entry-telemetry
      - run: npm run check-auth-telemetry
      - run: npm run check-flow-failure-telemetry
      - run: npm run check-telemetry-dispatcher
      - run: npm run check-story-deletion
      - run: npm run check-account-deletion
      - run: npm run check-owner-story-save
      - run: npm run check-story-beat-resilience
      - run: npm run check-reader-visibility-telemetry
      - run: npm run check-story-boundaries
      - run: npm run check-resonance-brief
      - run: npm run check-story-composer
      - run: npm run check-match-recovery
      - run: npm run eval-crisis
      - run: npm run smoke
      - run: npm run build
